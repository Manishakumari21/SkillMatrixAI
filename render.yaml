services:
  - type: web
    name: skillmatrix-api
    runtime: python
    buildCommand: apt-get update && apt-get install -y tesseract-ocr && pip install -r Backend/requirements.txt
    startCommand: cd Backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: skillmatrix
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: EMAIL_FROM
        value: no-reply@skillmatrix.ai
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PRIMARY_LLM_PROVIDER
        value: groq
      - key: SECONDARY_LLM_PROVIDER
        value: gemini
    plan: free
